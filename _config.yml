    - "https://www.youtube.com/@ChemBioInfo"

# --------------- Analytics --------------------------------
analytics:
  provider: false
  google:
    tracking_id:

# --------------- Reading Files ----------------------------
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# --------------- Conversion -------------------------------
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# --------------- Markdown Processing ----------------------
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# --------------- Collections ------------------------------
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# --------------- Page defaults ----------------------------
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: inner
      share: true
      comments: false

# --------------- Sass/SCSS --------------------------------
sass:
  sass_dir: _sass
  style: compressed

# --------------- Outputting -------------------------------
permalink: /:categories/:title/
timezone: Europe/Paris

# --------------- Plugins ----------------------------------
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# --------------- HTML Compression ------------------------
compress_html:
  clippings: all
  ignore:
    envs: development

# ============================================================
