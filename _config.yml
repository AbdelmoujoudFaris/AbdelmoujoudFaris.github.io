# --------------- Site Settings ----------------------------
teaser:
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false
comments:
  provider:
  disqus:
    shortname:
  discourse:
    server:
  facebook:
    appid:
    num_posts:
    colorscheme:
staticman:
  allowedFields: ["name", "email", "url", "message"]
  branch: "gh-pages"
  commitMessage: "New comment."
  filename: "comment-{@timestamp}"
  format: "yml"
  moderation: true
  path: "_data/comments/{options.slug}"
  requiredFields: ["name", "email", "message"]
  transforms:
    email: "md5"
  generatedFields:
    date:
      type: "date"
      options:
        format: "iso8601"
atom_feed:
  hide: false
  path:

# --------------- SEO Related ------------------------------
google_site_verification:
bing_site_verification:
alexa_site_verification:
yandex_site_verification:

# --------------- Social sharing / structured data ---------
twitter:
  username:
facebook:
  username:
  app_id:
  publisher:
og_image:
og_description:
social:
  type: "Person"
  name: "Abdelmoujoud Faris"
  links:
    - "https://orcid.org/0000-0003-0781-6523"
    - "https://www.researchgate.net/profile/Abdelmoujoud-Faris"
