name: &name "Abdelmoujoud Faris"
description: &description >
  PhD in Physical Chemistry (Molecular Modeling & Cheminformatics).
  Research Engineer in Bioinformatics at CNRS / Université de Montpellier – BIOCAMPUS.
  Specialised in QSAR/CADD, structural bioinformatics, molecular dynamics, and AI-driven drug discovery.
url: "https://AbdelmoujoudFaris.github.io"
baseurl: ""
repository: "AbdelmoujoudFaris/AbdelmoujoudFaris.github.io"

