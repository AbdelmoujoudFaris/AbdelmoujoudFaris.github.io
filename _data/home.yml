pillars_lead: "Cheminformatics is the centre of my work, supported by CADD, computational chemistry and structural bioinformatics, with AI/ML as a complementary set of tools."
pillars:
  - title: "Cheminformatics"
    badge: "Central expertise"
    core: true
    text: "Chemical data processing, fingerprints and descriptors, similarity and scaffold analysis, QSAR modelling and ADMET-based compound prioritisation."
    chips: ["RDKit", "Morgan fingerprints", "Tanimoto", "QSAR", "ADMET"]
  - title: "Computer-Aided Drug Design"
    text: "Pharmacophore modelling, virtual screening and molecular docking to prioritise compounds against targets such as the JAK-family kinases."
    chips: ["Pharmacophores", "Virtual screening", "Docking"]
  - title: "Computational Chemistry & Molecular Modelling"
    text: "Molecular dynamics, Martini coarse-grained simulations and MM-PBSA/MM-GBSA binding free-energy analysis."
    chips: ["GROMACS", "AMBER", "OpenMM"]
  - title: "Structural Bioinformatics & Computational Biology"
    text: "AlphaFold-Multimer, HADDOCK, protein–protein and antibody–antigen modelling, with multi-omics data analysed in a structural context."
    chips: ["AlphaFold-Multimer", "HADDOCK", "Multi-omics"]
  - title: "AI/ML for Molecular Research"
    badge: "Complementary"
    text: "Graph neural networks, protein language models and SHAP explanations, used alongside chemistry- and physics-based methods."
    chips: ["PyTorch", "PyTorch Geometric", "Protein language models", "SHAP"]
  - title: "Scientific Programming & Research Software"
    text: "Python workflows and tested tools such as docking-ai, QSAR-IL and OmicsFusion. Outputs are computational predictions, not experimental results."
    chips: ["Python", "Nextflow", "Docker"]

