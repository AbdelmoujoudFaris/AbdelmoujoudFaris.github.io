headline: "Computational Chemistry × Molecular AI"
role: "Computational Chemist · Cheminformatician · Bioinformatician · AI Research Engineer"

intro: >
  I develop computational and AI-driven approaches to molecular modelling,
  structural bioinformatics and drug discovery, combining scientific insight
  with reproducible research and software engineering.

hero_secondary: >
  My work moves between scales — from multi-omics data and protein structures
  to ligand–protein interactions and candidate molecules — using molecular
  dynamics, docking, cheminformatics and machine learning, and building the
  reproducible Python/R pipelines that carry the analysis from raw data to
  interpretable results.

research_summary: >
  My research sits at the intersection of computational chemistry,
  cheminformatics, structural bioinformatics and artificial intelligence. I use
  ligand- and structure-based methods to study protein–ligand recognition,
  molecular flexibility and binding energetics, and I apply machine learning to
  molecular property prediction and biological data analysis. A recurring theme
  is JAK-family kinase inhibitor design and protein–protein interface analysis,
  alongside transcriptomic and multi-omics workflows.

research_interests:
  - "Computational Drug Discovery"
  - "Cheminformatics & QSAR"
  - "Molecular Dynamics"
  - "Structural Bioinformatics"
  - "Machine Learning & GNNs"
  - "Protein Language Models"
  - "Multi-Omics"
  - "Scientific Software"

research_areas:
  - title: "Computer-Aided Drug Design"
    text: "Structure- and ligand-based virtual screening, molecular docking, pharmacophore modelling and ADMET filtering for early hit and lead discovery."
  - title: "Molecular Dynamics & Energetics"
    text: "GROMACS/AMBER simulations, trajectory analysis, PCA free-energy landscapes, structural clustering and MM-PBSA/MM-GBSA binding free-energy estimates."
  - title: "Structural Bioinformatics"
    text: "Protein structure modelling, protein–protein complex analysis, residue-level interaction mapping and free-energy decomposition of interfaces."
  - title: "Cheminformatics & QSAR"
    text: "RDKit-based descriptor and fingerprint pipelines, 2D/3D QSAR, model validation and structure–activity interpretation."
  - title: "Machine Learning for Molecules"
    text: "Graph neural networks, molecular representation learning, model interpretation with SHAP and ML-assisted scoring and ranking workflows."
  - title: "Omics & Biological Networks"
    text: "RNA-seq differential expression, pathway and gene-set enrichment, co-expression/network analysis and multi-omics integration."

about: |
  I am a computational scientist and research engineer with a PhD in Physical
  Chemistry. My work bridges molecular modelling and data-driven biology:
  on one side docking, molecular dynamics, free-energy analysis and structural
  bioinformatics; on the other, cheminformatics, machine learning and multi-omics
  data analysis.

  I build the software behind the science — reproducible Python and R pipelines,
  scientific tools and automated analyses — and I care about making computational
  results traceable, documented and reusable. I work with experimental and
  industrial partners to turn structural and biological questions into testable
  computational hypotheses.

