headline: "Cheminformatics × Computational Chemistry"
role: "Cheminformatics & Computational Chemistry Scientist"

intro: >
  PhD scientist in cheminformatics and computational chemistry: CADD, molecular
  modelling, structural bioinformatics and AI/ML for drug discovery, with
  reproducible research software.

hero_secondary: >
  My work moves between scales, from protein structures and protein-ligand
  interactions to candidate molecules, using QSAR, docking, molecular dynamics,
  cheminformatics and machine learning, and building the reproducible Python
  pipelines that carry the analysis from raw data to interpretable results.

research_summary: >
  My research applies computational chemistry, cheminformatics and molecular
  modelling to drug discovery, with structural bioinformatics and machine
  learning as complementary tools. A recurring theme is JAK-family kinase
  inhibitor design, from QSAR and pharmacophore screening to docking, molecular
  dynamics and binding free-energy analysis, extended to protein-protein and
  antibody-antigen modelling.

research_interests:
  - "Computer-Aided Drug Discovery"
  - "Cheminformatics & QSAR"
  - "Molecular Modelling & Dynamics"
  - "Structural Bioinformatics"
  - "AI/ML for Drug Discovery"
  - "Scientific Software"
  - "Protein Language Models"
  - "Multi-Omics"

research_areas:
  - title: "Computer-Aided Drug Discovery"
    text: "QSAR and 3D-QSAR, molecular descriptors and fingerprints, pharmacophore modelling, virtual screening, molecular docking and ADMET prioritisation."
  - title: "Molecular Modelling & Computational Chemistry"
    text: "Molecular dynamics with GROMACS, AMBER and OpenMM, Martini coarse-grained simulations and MM-PBSA/MM-GBSA binding free-energy analysis."
  - title: "Structural Bioinformatics"
    text: "AlphaFold and AlphaFold-Multimer, HADDOCK, protein-protein interactions and antibody-antigen modelling."
  - title: "AI/ML for Drug Discovery"
    text: "Graph neural networks, protein language models, molecular representations and embeddings, explainable AI (SHAP), with PyTorch and scikit-learn."
  - title: "Multi-Omics & Computational Biology"
    text: "Transcriptomic and proteomic analysis, protein interaction networks and integrated biological data analysis."

about: |
  I am a computational chemist and cheminformatics scientist with a PhD in
  Computational Chemistry (Université Sidi Mohamed Ben Abdellah, 2025). My
  doctoral research focused on JAK3 inhibitor design, combining QSAR and
  3D-QSAR, pharmacophore modelling, virtual screening, molecular docking,
  molecular dynamics and MM-PBSA/MM-GBSA free-energy analysis.

  I then worked on JAK1/JAK3 structural bioinformatics at Université Paris Cité
  (AlphaFold-Multimer, HADDOCK, pharmacophore-based peptide design) and on
  computational antifungal drug discovery at the University of Angers
  (fingerprint and similarity analysis, docking, molecular dynamics and ADMET
  prioritisation). Since November 2025 I have been a Research Engineer at
  BioCampus Montpellier (CNRS UAR3426 / INSERM US9), working on computational
  antibody modelling with AlphaFold-Multimer, HADDOCK, Martini coarse-grained
  simulations, protein language models and graph neural networks.

  I also write research software in Python, such as docking-ai, QSAR-IL and
  OmicsFusion. These tools produce computational predictions, not experimental
  results. I have 17 peer-reviewed articles (11 as first author); see ORCID
  0000-0003-0781-6523.

