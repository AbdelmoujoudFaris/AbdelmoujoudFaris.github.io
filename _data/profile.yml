badge: "⏳ Computational Chemistry · Bioinformatics · AI for Drug Discovery"

about: >
  I am a Computational Scientist, Bioinformatician and Computational Chemist —
  with a PhD in Physical Chemistry — working at the intersection of
  multi-omics, structural biology, molecular modelling, AI and drug discovery.
  My work spans both ends of that range: systems-level analysis of biological
  data and molecular-level modelling of the proteins and ligands involved.


  On the molecular side, I work with molecular docking, structure- and
  ligand-based drug design, QSAR/SAR, pharmacophore modelling, virtual
  screening, ADMET prediction, molecular dynamics and free-energy analysis
  (MM-PBSA/MM-GBSA, conformational analysis, PCA free-energy landscapes,
  structural clustering) — using RDKit, PyMOL, GROMACS, AMBER/AmberTools,
  OpenMM, Desmond, AutoDock Vina and GOLD. I also analyse protein–protein
  interactions with AlphaFold/AlphaFold-Multimer, molecular-dynamics
  refinement, residue-level interaction analysis and free-energy
  decomposition: a representative example is my work on JAK3/JAK1, where
  structural modelling, AlphaFold-based complex prediction, molecular
  dynamics, interaction analysis and free-energy decomposition come together
  to identify key interface residues and derive structure-based pharmacophore
  hypotheses.


  On the bioinformatics side, I analyse transcriptomic and multi-omics data:
  RNA-seq, differential expression (DESeq2, edgeR, limma), pathway and
  gene-set enrichment (GSEA, clusterProfiler), co-expression and network
  analysis (Cytoscape) and functional interpretation — including
  transcriptomic analyses of JAK/STAT signaling. I work across
  transcriptomics, proteomics and metabolomics, using integration approaches
  such as mixOmics/DIABLO and MOFA2 alongside PCA, PLS-DA, clustering and
  correlation analysis, to move from processed biological datasets toward
  interpretable biological mechanisms.


  My main strength is bridging computational scales: omics → pathways →
  networks → proteins → structures → molecular interactions → drug
  candidates. A project can enter this workflow at any point — a
  transcriptomic signature can be traced through enrichment and network
  analysis to candidate proteins, then taken into structural modelling,
  molecular dynamics and interaction analysis, and where relevant into
  structure-based drug or peptide design. I combine this with machine
  learning (Random Forest, XGBoost, neural and graph neural networks, PyTorch,
  PyTorch Geometric), explainable AI (SHAP) and generative-AI tooling (LLMs,
  embeddings, RAG, vector databases, AI agents), with a focus on AI for drug
  discovery, molecular modelling, bioinformatics and scientific automation.


  I build the software behind this work: reproducible Python/R pipelines and
  scientific tools built with Bash, Linux, Git, Docker, Conda, Snakemake,
  APIs, R Shiny, Jupyter and HPC/Slurm — from raw data to analysis, automated
  where it makes sense.

