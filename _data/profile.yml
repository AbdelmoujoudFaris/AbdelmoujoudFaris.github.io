# ---- Public repositories (descriptions taken from each repository README) ----
projects:
  - name: "docking-ai"
    description: "RDKit graph featurisation, a relational GCN evaluated with scaffold splits, ranked virtual screening with optional AutoDock Vina re-scoring and gradient/occlusion explanations. 28 tests; example labels are synthetic."
    domain: "Cheminformatics & CADD"
    tags: ["RDKit", "GNN", "AutoDock Vina"]
    url: "https://github.com/AbdelmoujoudFaris/docking-ai"
  - name: "QSAR-IL"
    description: "QSAR workflow for SMILES + IC50 data: RDKit descriptors, Kennard–Stone split, MLR/ANN/RF/SVM models, feature selection, external validation, y-randomisation and applicability domain. 13 backend test modules. Beta tool; link goes to its demo page."
    domain: "Cheminformatics & QSAR"
    tags: ["QSAR", "RDKit", "scikit-learn"]
    url: "https://frogbiox.com/tools/qsar-il"
  - name: "OmicsFusion"
    description: "Reproducible multi-omics integration framework: Python core with an R bridge, Nextflow workflow, YAML configuration, CLI and Streamlit interfaces. CI, Docker and 12 test modules."
    domain: "Bioinformatics"
    tags: ["Python", "Nextflow", "Docker"]
    url: "https://github.com/AbdelmoujoudFaris/OmicsFusion"
  - name: "BioForge"
    description: "Research-stage framework for pocket-conditioned molecular generation and in silico triage (FastAPI microservices; includes the PharmaForge diffusion engine). No checkpoint trained on real binding data; not experimentally validated."
    domain: "AI Drug Discovery (research-stage)"
    tags: ["Python", "Microservices", "Generative Design"]
    url: "https://github.com/AbdelmoujoudFaris/BioForge"
  - name: "InterfaceShapeAI (DLPP)"
    description: "Research framework (v0.1/v0.2) testing whether protein–protein interface geometry and local topology encode structural motifs and molecular function, using 3D deep learning on voxelised interfaces."
    domain: "Structural Bioinformatics"
    tags: ["Python", "Deep Learning", "Protein Interfaces"]
    url: "https://github.com/AbdelmoujoudFaris/DLPP"
  - name: "EnhancoDNA"
    description: "Research platform for studying transcription-factor cooperativity and DNA-mediated allostery by combining deep learning, molecular dynamics and AI-assisted structural analysis."
    domain: "Structural Biology"
    tags: ["Python", "MD", "Deep Learning"]
    url: "https://github.com/AbdelmoujoudFaris/EnhancoDNA"
  - name: "PMAtlas"
    description: "Turns a molecular-dynamics trajectory into an explorable 3D map of conformational states and transitions. Demo data are synthetic."
    domain: "Molecular Dynamics"
    tags: ["Python", "MD Trajectories", "Visualisation"]
    url: "https://github.com/AbdelmoujoudFaris/PMAtlas"
  - name: "RDKit & Advanced Python"
    description: "Educational notebook lab introducing advanced Python and the RDKit cheminformatics toolkit, from object-oriented programming to molecular workflows."
    domain: "Educational resource"
    tags: ["Jupyter", "RDKit", "Python"]
    url: "https://github.com/AbdelmoujoudFaris/Rdkit-and-advanced-Python"
  - name: "Multi-Omics Dataset AI Finder"
    description: "Streamlit application that searches GEO, ArrayExpress, PRIDE, MetaboLights and TCGA/cBioPortal for public datasets matching a biological question. Requires an Anthropic API key."
    domain: "Scientific AI"
    tags: ["Streamlit", "LLM Tools", "Data Discovery"]
    url: "https://github.com/AbdelmoujoudFaris/Multi-Omics-Dataset-AI-Finder"
  - name: "ADMET Analyzer"
    description: "Desktop GUI for rule-based drug-likeness and ADMET property profiling (Lipinski, Veber, Ghose, QED) with 2D structure plots; not a trained prediction model."
    domain: "Cheminformatics"
    tags: ["Python", "ADMET", "RDKit"]
    url: "https://github.com/AbdelmoujoudFaris/ADMET_Analyzer"
  - name: "Free-Energy Landscape & Structural Clustering"
    description: "PCA-based free-energy landscape construction and structural clustering of molecular-dynamics trajectories, with a companion PCA analysis notebook."
    domain: "Molecular Dynamics"
    tags: ["PCA", "Clustering", "Trajectory Analysis"]
    url: "https://github.com/AbdelmoujoudFaris/Free-energy-landscape-principal-component-analysis-and-structural-clustering"

