# ---- Public repositories (descriptions taken from each repository README) ----
projects:
  - name: "BioForge"
    description: "Modular, containerised platform for AI-native drug repurposing and de novo design: from a PDB ID, UniProt accession or raw sequence through structure resolution and generative design."
    domain: "AI Drug Discovery"
    tags: ["Python", "Microservices", "Generative Design"]
    url: "https://github.com/AbdelmoujoudFaris/BioForge"
  - name: "InterfaceShapeAI (DLPP)"
    description: "Research framework testing whether protein–protein interface geometry and local topology encode structural motifs and molecular function, using deep learning on 3D shape representations."
    domain: "Structural Bioinformatics"
    tags: ["Python", "Deep Learning", "Protein Interfaces"]
    url: "https://github.com/AbdelmoujoudFaris/DLPP"
  - name: "EnhancoDNA"
    description: "Platform for studying transcription-factor cooperativity and DNA-mediated allostery by combining deep learning, molecular dynamics and AI-assisted structural analysis."
    domain: "Structural Biology"
    tags: ["Python", "MD", "Deep Learning"]
    url: "https://github.com/AbdelmoujoudFaris/EnhancoDNA"
  - name: "OmicsFusion"
    description: "Reproducible multi-omics platform integrating transcriptomics, proteomics, metabolomics, microbiome and clinical tables into interpretable biological results."
    domain: "Bioinformatics"
    tags: ["Python", "Multi-Omics", "pandas/scikit-learn"]
    url: "https://github.com/AbdelmoujoudFaris/OmicsFusion"
  - name: "PMAtlas"
    description: "Turns a molecular-dynamics trajectory into an explorable 3D map of conformational states and transitions instead of a linear movie."
    domain: "Molecular Dynamics"
    tags: ["Python", "MD Trajectories", "Visualisation"]
    url: "https://github.com/AbdelmoujoudFaris/PMAtlas"
  - name: "ADMET Analyzer"
    description: "Desktop GUI for rapid ADMET profiling of drug candidates, with 2D molecular structure visualisation and publication-quality figure output."
    domain: "Cheminformatics"
    tags: ["Python", "ADMET", "RDKit"]
    url: "https://github.com/AbdelmoujoudFaris/ADMET_Analyzer"
  - name: "Multi-Omics Dataset AI Finder"
    description: "Streamlit application that searches GEO, ArrayExpress, PRIDE, MetaboLights and TCGA/cBioPortal for real, verifiable public datasets matching a biological question."
    domain: "Scientific AI"
    tags: ["Streamlit", "LLM Tools", "Data Discovery"]
    url: "https://github.com/AbdelmoujoudFaris/Multi-Omics-Dataset-AI-Finder"
  - name: "docking-ai"
    description: "Single local pipeline from SMILES to docking pose: RDKit molecular graphs, GNN property prediction, ranking and AutoDock Vina integration."
    domain: "Molecular AI"
    tags: ["RDKit", "GNN", "AutoDock Vina"]
    url: "https://github.com/AbdelmoujoudFaris/docking-ai"
  - name: "Free-Energy Landscape & Structural Clustering"
