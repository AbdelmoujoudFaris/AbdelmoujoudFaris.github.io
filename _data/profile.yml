badge: "⏳ Computational Chemistry · Bioinformatics · AI for Drug Discovery"

about: >
  I am a Computational Chemist, Bioinformatician, and Research Engineer with a
  PhD in Physical Chemistry, working at the intersection of computational
  chemistry, structural bioinformatics, molecular modeling, cheminformatics,
  and AI for drug discovery.


  My expertise spans molecular docking, molecular dynamics (GROMACS, AMBER,
  Desmond, OpenMM), QSAR/SAR, pharmacophore modeling, virtual screening,
  ADMET, MM-PBSA/MM-GBSA, AlphaFold2, protein–ligand and protein–protein
  modeling, and antibody design.


  I also specialize in Machine Learning, Deep Learning, GNNs, Generative AI,
  LLMs, RAG, embeddings, vector databases, semantic search, and AI agents for
  scientific research and automation.


  My bioinformatics experience covers RNA-seq, transcriptomics, proteomics,
  metabolomics, and multi-omics integration, while my software engineering
  skills include Python, R, Bash, Linux, Git/GitHub, Docker, Snakemake,
  Flask, R Shiny, APIs, and reproducible computational pipelines.


  I combine Computational Chemistry, Bioinformatics, Structural Biology,
  Molecular Dynamics, AI/ML, LLM/RAG, and Scientific Software Engineering to
  develop reproducible, intelligent, and scalable solutions for drug
  discovery and biomedical research.

