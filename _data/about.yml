# ---------------- research software ----------------
software_note: "These tools support computational research and prediction. Their outputs are computational predictions, not experimentally validated biological activity."
software:
  - name: "docking-ai"
    domain: "Cheminformatics & CADD"
    text: "RDKit graph featurisation, a relational GCN evaluated with scaffold splits, ranked virtual screening with optional AutoDock Vina re-scoring and gradient/occlusion explanations. 28 tests; example labels are synthetic."
    url: "https://github.com/AbdelmoujoudFaris/docking-ai"
    link_label: "Repository"
  - name: "QSAR-IL"
    domain: "Cheminformatics & QSAR"
    text: "QSAR workflow for SMILES + IC50 data: RDKit descriptors, Kennard–Stone split, MLR/ANN/RF/SVM models, feature selection, external validation, y-randomisation and applicability domain. Beta tool; the link goes to its demo page."
    url: "https://frogbiox.com/tools/qsar-il"
    link_label: "Demo page"
  - name: "OmicsFusion"
    domain: "Bioinformatics"
    text: "Reproducible multi-omics integration framework: Python core with an R bridge, Nextflow workflow, CLI and Streamlit interfaces. CI, Docker and 12 test modules."
    url: "https://github.com/AbdelmoujoudFaris/OmicsFusion"
    link_label: "Repository"
