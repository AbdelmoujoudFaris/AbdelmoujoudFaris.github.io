# ---------------- central expertise ----------------
core:
  title: "Cheminformatics"
  lead: "The central strand of my work: preparing and representing chemical data, measuring molecular similarity, building and validating predictive models, and prioritising compounds for drug discovery."
  groups:
    - id: "A"
      title: "Molecular data processing and chemical informatics"
      preview: "SMILES handling · parsing and validation · compound library preparation"
      desc: "Reading, validating and organising chemical structures and datasets before modelling."
      applied: ["SMILES and molecular structure handling", "Molecular parsing and validation", "Chemical data curation", "Compound library preparation", "Molecular data transformation"]
      knowledge: ["Molecular standardisation and normalisation", "Salt removal and fragment handling", "Tautomer and protonation-state considerations", "Stereochemistry handling", "Duplicate detection", "Chemical database integration", "Chemical structure searching"]
    - id: "B"
      title: "Molecular descriptors and representations"
      preview: "Morgan fingerprints · physicochemical and 2D/3D descriptors · molecular graphs"
      desc: "Numerical and graph representations of molecules used for similarity, modelling and machine learning."
      applied: ["Molecular fingerprints", "Morgan fingerprints", "Topological descriptors", "Physicochemical descriptors", "2D and 3D molecular descriptors", "Molecular graph representations", "Molecular feature engineering"]
      knowledge: ["MACCS fingerprints", "Functional group analysis", "Substructure representations", "Chemical space representation"]
    - id: "C"
      title: "Molecular similarity and chemical space analysis"
      preview: "Tanimoto similarity · Bemis–Murcko scaffolds · SAR exploration"
      desc: "Comparing compounds, scaffolds and targets to find analogues and understand structure–activity trends."
      applied: ["Tanimoto coefficient", "Fingerprint-based similarity", "Scaffold similarity", "Bemis–Murcko scaffold analysis", "Similarity searching", "Analogue identification", "Structure–activity relationship (SAR) exploration", "Compound library comparison"]
      knowledge: ["Substructure similarity", "Molecular clustering", "Chemical diversity analysis", "Chemical space visualisation"]
    - id: "D"
      title: "QSAR and predictive modelling"
      preview: "QSAR and 3D-QSAR · MLR, RF, SVM, ANN · applicability domain and validation"
      desc: "Building, validating and interpreting predictive models of molecular activity."
      applied: ["Classical QSAR", "3D-QSAR", "Descriptor-based modelling", "Feature selection", "Multiple Linear Regression (MLR)", "Random Forest (RF)", "Support Vector Machines (SVM)", "Artificial Neural Networks (ANN)", "XGBoost", "Applicability Domain assessment", "Y-randomisation", "Internal and external validation", "Scaffold-aware evaluation", "Model interpretability", "Feature importance analysis"]
      knowledge: ["Dimensionality reduction", "Ensemble learning", "Hyperparameter optimisation"]
    - id: "E"
      title: "Pharmacophore modelling"
      preview: "Hypothesis generation · feature mapping · pharmacophore-based screening"
      desc: "Ligand-based pharmacophore models used to screen and prioritise compounds."
      applied: ["Pharmacophore hypothesis generation", "3D pharmacophore modelling", "Hydrogen-bond donor and acceptor features", "Hydrophobic and aromatic features", "Feature mapping and alignment", "Pharmacophore-based virtual screening", "Ligand-based pharmacophore analysis", "Pharmacophore-guided compound prioritisation"]
      knowledge: ["2D pharmacophore modelling"]
    - id: "F"
      title: "Virtual screening and molecular docking"
      preview: "Ligand- and structure-based screening · docking · interaction profiling"
      desc: "Screening and ranking compounds against protein targets, followed by molecular dynamics where relevant."
      applied: ["Ligand-based virtual screening", "Structure-based virtual screening", "Molecular docking", "Binding-site analysis", "Protein–ligand interaction analysis", "Docking pose evaluation", "Molecular interaction profiling", "Docking score interpretation", "Compound ranking and prioritisation", "Molecular dynamics follow-up"]
      knowledge: ["Consensus-based evaluation"]
    - id: "G"
      title: "ADMET and drug-likeness"
      preview: "Physicochemical profiling · Rule of Five · multi-parameter prioritisation"
      desc: "Computational property and toxicity assessment used to prioritise candidates (predictions, not measurements)."
      applied: ["Physicochemical property profiling", "Lipophilicity and solubility assessment", "Drug-likeness evaluation", "Lipinski's Rule of Five", "ADMET assessment", "Toxicity prediction", "Multi-parameter compound prioritisation"]
      knowledge: ["Medicinal chemistry filters"]
    - id: "H"
      title: "Molecular design and lead optimisation"
      preview: "SAR analysis · scaffold exploration · structure-guided design"
      desc: "Computational design of derivatives and prioritisation of candidates for follow-up."
      applied: ["Scaffold exploration", "Structure–activity relationship analysis", "Substructure-based compound modification", "Structure-guided molecular design", "Computational candidate prioritisation"]
      knowledge: ["Lead optimisation strategies"]

