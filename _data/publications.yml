    abstract: "Modeling the structural properties of novel morpholine-bearing 1, 5-diaryl-diazole derivatives as potent COX-2 inhibitor, two proposed models based on CoMFA and CoMSIA were evaluated by external and internal validation methods. Partial least squares analysis produced statistically significant models with Q\n           2 \n          values of 0.668 and 0.652 for CoMFA and CoMSIA, respectively, and also a significant non-validated correlation coefficient R² with values of 0.882 and 0.878 for CoMFA and CoMSIA, respectively. Both models met the requirements of Golbraikh and Tropsha, which means that both models are consistent with all validation techniques. Analysis of the CoMFA and CoMSIA contribution maps and molecular docking revealed that the R1 substituent has a very significant effect on their biological activity. The most active molecules were evaluated for their thermodynamic stability by performing MD simulations for 100 ns; it was revealed that the designed macromolecular ligand complex with 3LN1 protein exhibits a high degree of structural and conformational stability. Based on these results, we predicted newly designed compounds, which have acceptable oral bioavailability properties and would have high synthetic accessibility."
