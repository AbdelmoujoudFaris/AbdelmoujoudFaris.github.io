    abstract: "Objective: \n This study aimed to discover a novel active compound capable of effectively inhibiting JAK3/STAT1 and CYP3A4 using molecular modelling techniques, with the goal of treating autoimmune diseases such as cancer and specifically rheumatoid arthritis. The study involved modelling compounds derived from pyrazolopyrimidine, followed by screening methods to identify the most promising compounds. Moreover, this study seeks to identify potential compounds that can inhibit JAK3/STAT through molecular modelling techniques and validate the stability and affinity of the predicted molecule. \n \n \n Methods: \n Various molecular modelling techniques were employed to identify potential compounds and assess the stability and affinity of the predicted molecule. A pharmacophore hypothesis was developed to obtain crucial information about the experimental series of pyrazolopyrimidine studied, which served as the basis for designing new molecules. Additionally, ADMET was utilized to predict and evaluate the pharmacokinetic properties and potential toxicity of the compound prior to synthesis or utilization. To determine the essential residues involved in the interaction between the molecule and the target JAK3 protein, the covalent docking method was applied. We further validated the binding stability of the JAK3 protein with the ligands ZINC62162141 and Tofacitinib, both of which have been approved by the FDA for JAK3/STAT inhibition., using DFT/B3LYP/6-31G molecular dynamics simulations"
