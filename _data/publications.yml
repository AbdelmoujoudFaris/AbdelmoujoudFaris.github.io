    abstract: "Cyclin-dependent kinase 9 (CDK9) and cytochrome P450 3A4 (CYP3A4) have emerged as promising targets in the development of anticancer drugs, presenting a consistent challenge in the quest for potent inhibitors. CDK9 inhibitors can selectively target fast-growing cancer cells by disrupting transcription elongation, which in turn hinders the production of proteins essential for cell cycle progression and survivaŚ. Understanding how CYP3A4 metabolizes specific chemotherapy drugs allows for personalized treatment plans, optimizing drug dosages according to a patient’s metabolic profile. Since many cancer patients undergo combination therapies, and CYP3A4 is vital in drug metabolism, its inhibition or induction by one drug can alter the plasma levels of others, potentially leading to treatment failure or increased toxicity. Therefore, managing CYP3A4 activity is critical for effective cancer treatment. Employing a range of computational methodologies, this study systematically investigated the binding mechanisms of pyrimidine derivatives against CDK9 and CYP3A4. The field-based model demonstrated high R 2 values (0.99), with Q 2 (0.66), demonstrating its ability to predict in silico inhibitory activity against the target of this study. The screening process followed in this work led to the discovery of powerful new inhibitor compounds. Of the 15 new compounds designed, three have a high affinity with the target (ranging from −8 to −9 kcal/mol kcal/mol) and were singled out through "
