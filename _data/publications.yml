    abstract: "The heterocycle compounds, with their diverse functionalities, are particularly effective in inhibiting Janus kinases (JAKs). Therefore, it is crucial to identify the correlation between their complex structures and biological activities for the development of new drugs for the treatment of rheumatoid arthritis (RA) and cancer. In this study, a diverse set of 28 heterocyclic compounds selective for JAK1 and JAK3 was employed to construct quantitative structure-activity relationship (QSAR) models using multiple linear regression (MLR). Artificial neural network (ANN) models were employed in the development of QSAR models. The robustness and stability of the models were assessed through internal and external methodologies, including the domain of applicability (DoA). The molecular descriptors incorporated into the model exhibited a satisfactory correlation with the receptor-ligand complex structures of JAKs observed in X-ray crystallography, making the model interpretable and predictive. Furthermore, pharmacophore models ADRRR and ADHRR were designed for each JAK1 and JAK3, proving effective in discriminating between active compounds and decoys. Both models demonstrated good performance in identifying new compounds, with an ROC of 0.83 for the ADRRR model and an ROC of 0.75 for the ADHRR model. Using a pharmacophore model, the most promising compounds were selected based on their strong affinity compared to the most active compounds in the studied series each JAK1 and JAK3. Not"
