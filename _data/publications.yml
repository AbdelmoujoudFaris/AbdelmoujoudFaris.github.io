    abstract: "The Janus kinase 3 (JAK3) family, particularly JAK3, is pivotal in initiating autoimmune diseases such as rheumatoid arthritis. Recent advancements have focused on developing antirheumatic drugs targeting JAK3, leading to the discovery of novel pyrazolopyrimidine-based compounds as potential inhibitors. This research employed covalent docking, ADMET (Absorption, Distribution, Metabolism, Excretion, Toxicity) analysis, molecular dynamics modeling, and MM/GBSA (Molecular Mechanics Generalized Born Surface Area) binding free energy techniques to screen 41 in silico-designed pyrazolopyrimidine derivatives. Initially, 3D structures of the JAK3 enzyme were generated using SWISS-MODEL, followed by virtual screening and covalent docking via AutoDock4 (AD4). The selection process involved the AMES test, binding affinity assessment, and ADMET analysis, narrowing down the candidates to 27 compounds that passed the toxicity test. Further covalent docking identified compounds 21 and 41 as the most promising due to their high affinity and favourable ADMET profiles. Subsequent development led to the creation of nine potent molecules, with derivatives 43 and 46 showing exceptional affinity upon evaluation through molecular dynamics simulation and MM/GBSA calculations over 300 nanoseconds, comparable to tofacitinib, an approved RA drug. However, compounds L21 and L46 demonstrated stable performance, suggesting their effectiveness in treating rheumatoid arthritis and other autoimmune condition"
