<ul class="xp-chips">
  {%- for item in include.applied %}

  {%- endfor %}
  {%- for item in include.knowledge %}
  <li class="xp-chip xp-chip--knowledge">{{ item }}<span class="visually-hidden"> (working knowledge)</span></li>
  {%- endfor %}
</ul>
