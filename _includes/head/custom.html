{% include base_path %}

<!-- start custom head snippets -->

<script>
  try {
    if (localStorage.getItem("af-theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  } catch (e) { /* storage unavailable: keep light default */ }
</script>

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ '/assets/css/academicons.css' | relative_url }}"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}"/>
<link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}"/>
<link rel="icon" type="image/png" href="{{ '/images/favicon-32x32.png' | relative_url }}" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ '/images/favicon-192x192.png' | relative_url }}" sizes="192x192"/>
<link rel="manifest" href="{{ '/images/manifest.json' | relative_url }}"/>
<link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}"/>
<meta name="theme-color" content="#123b72" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0b1f3a" media="(prefers-color-scheme: dark)"/>
<meta name="color-scheme" content="light dark"/>

<!-- end custom head snippets -->
