{% assign hm = site.data.home %}
<section class="section section--alt" id="videos" aria-labelledby="home-videos">
  <div class="container">
    <p class="section__eyebrow">ByteM2Mind</p>
    <h2 class="section__title" id="home-videos">Featured videos</h2>
    <div class="home-videos">
      {% for v in hm.videos %}
        <article class="home-video">
          <a class="home-video__thumb" href="https://www.youtube.com/watch?v={{ v.id }}" data-video="{{ v.id }}" target="_blank" rel="noopener noreferrer" aria-label="Play video: {{ v.title }}">
            <img src="https://i.ytimg.com/vi/{{ v.id }}/hqdefault.jpg" alt="" width="480" height="360" loading="lazy" />
            <span class="home-video__play" aria-hidden="true">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </span>
          </a>
          <div class="home-video__body">
            <h3 class="home-video__title">{{ v.title }}</h3>
            <p class="home-video__channel">{{ v.channel }}</p>
            <p class="home-video__text">{{ v.text }}</p>
            <a class="text-link" href="https://www.youtube.com/watch?v={{ v.id }}" target="_blank" rel="noopener noreferrer">Watch on YouTube &#8599;</a>
          </div>
        </article>
      {% endfor %}
    </div>
  </div>
</section>
