{% include base_path %}

<header class="site-header" id="site-header">
  <div class="container site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Abdelmoujoud Faris — home">
      <span class="site-brand__mark" aria-hidden="true">AF</span>
      <span class="site-brand__text">Abdelmoujoud Faris</span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <ul class="site-nav__list" id="site-nav-list">
        {% for item in site.data.profile.nav %}
          <li>
            <a href="{% if page.url == '/' %}{{ item.url }}{% else %}{{ '/' | relative_url }}{{ item.url }}{% endif %}" class="site-nav__link" data-nav-id="{{ item.id }}">{{ item.label }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>

    <div class="site-header__actions">
      <a class="btn btn--primary btn--sm site-header__cv" href="{{ '/cv/' | relative_url }}">CV</a>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch to dark theme" aria-pressed="false">
        <svg class="icon-btn__sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="icon-btn__moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
      <button type="button" class="nav-burger" id="nav-burger" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
